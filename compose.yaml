name: league-portfolio
services:
    dev-server:
        build:
            context: .
            dockerfile: server/Dockerfile
        image: league-dev-server:latest
        ports:
            - 3001:3001
        volumes:
            - ./server:/app/server
            - ./api:/app/api
            - ./server/node_modules:/app/node_modules
        env_file:
            - ./server/.env
    frontend:
        build:
            context: .
            dockerfile: Dockerfile
        image: league-frontend:latest
        ports:
            - 5173:5173
        volumes:
            - .:/app
        environment:
            - API_TARGET=http://dev-server:3001
        env_file:
            - .env
