name: league-portfolio
networks:
  cms_default:
    external: true

services:
    frontend:
        build:
            context: .
            dockerfile: Dockerfile
        image: league-frontend:latest
        container_name: portfolio-frontend
        ports:
            - 5173:5173
        volumes:
            - .:/app
            - /app/node_modules
        environment:
            - API_TARGET=http://api:8080
        env_file:
            - .env
  
    api:
        build:
          context: ./api
          dockerfile: Dockerfile.dev
        container_name: portfolio-backend
        volumes:
          - ./api:/app
        ports:
          - "8080:8080"
        env_file:
          - .env
        environment:
          - REDIS_ADDR=${REDIS_ADDR}
          - POSTGRES_HOST=postgres
          - POSTGRES_PORT=5432
          - POSTGRES_USER=${POSTGRES_USER}
          - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
          - POSTGRES_DB=${POSTGRES_DB}
          - DIRECTUS_URL=${DIRECTUS_URL:-http://directus:8055}
        depends_on:
          redis:
            condition: service_healthy
        networks:
          - default
          - cms_default

    redis:
        image: redis:7-alpine
        container_name: portfolio-redis
        ports:
          - "6379:6379"
        healthcheck:
          test: ["CMD", "redis-cli", "ping"]
          interval: 5s
          timeout: 3s
          retries: 5

