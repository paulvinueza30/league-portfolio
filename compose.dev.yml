name: league-portfolio-dev
services:
    frontend:
        build:
            context: ./frontend
            dockerfile: Dockerfile
        image: league-frontend:latest
        container_name: portfolio-frontend
        ports:
            - 5173:5173
        volumes:
            - ./frontend:/app
            - /app/node_modules
        environment:
            - API_TARGET=http://api:8080
        env_file:
            - ./frontend/.env
        networks:
          - app-network

    api:
        build:
          context: ./backend
          dockerfile: Dockerfile.dev
        container_name: portfolio-backend
        volumes:
          - ./backend:/app
          - ./backend/data/posts:/app/posts
          - ./backend/data/projects:/app/projects
        ports:
          - "8080:8080"
        env_file:
          - ./backend/.env
        environment:
          - REDIS_ADDR=redis:6379
        depends_on:
          redis:
            condition: service_healthy
        networks:
          - app-network

    redis:
        image: redis:7-alpine
        container_name: portfolio-redis
        ports:
          - "6379:6379"
        healthcheck:
          test: ["CMD", "redis-cli", "ping"]
          interval: 5s
          timeout: 3s
          retries: 5
        networks:
          - app-network

networks:
  app-network:
    driver: bridge
